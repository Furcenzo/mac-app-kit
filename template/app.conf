# Settings of this app for the mac-app-kit scripts in scripts/ (zsh syntax; defaults in scripts/app-config.sh).
APP_NAME="__APP_NAME__"                  # name of the .app
EXECUTABLE="__EXECUTABLE__"              # Swift executable target, Sources/__EXECUTABLE__
BUNDLE_ID="__BUNDLE_ID__"
GITHUB_REPO="__REPO__"
CASK="__SLUG__"                          # Casks/__SLUG__.rb in Furcenzo/homebrew-tap (add the cask before the first release)
SITE_SLUG=""                             # name for dev.furian.sk's update-site.sh, once the site shows the app
CATEGORY="public.app-category.utilities"
MIN_MACOS="15.0"
AGENT_APP=0                              # 1 = menu bar only, no Dock icon
DEV_CHANNEL=1                            # development builds are "__APP_NAME__ Dev" (__BUNDLE_ID__.dev)
